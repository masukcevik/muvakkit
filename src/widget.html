<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Muvakkit</title>
<style>
  :root {
    --s: 1; --bg: rgba(26,17,17,0.8); --text: #F8F1ED; --sub: rgba(248,241,237,0.72);
    --accent: #F3E6D0; --entered: #4C000F; --shadow: none; --line: rgba(248,241,237,0.08); --radius: 12px;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; align-items: flex-end; justify-content: flex-end; }
  .pill {
    display: inline-flex; align-items: center; gap: calc(10px * var(--s));
    padding: calc(9px * var(--s)) calc(14px * var(--s)) calc(9px * var(--s)) calc(12px * var(--s)); margin: 4px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); cursor: default; transition: background .3s, border-color .3s;
    white-space: nowrap;
  }
  .pill.yaklasiyor { border-color: var(--accent); }
  .pill.girdi { background: var(--entered); border-color: var(--entered); }
  .texts { display: flex; flex-direction: column; line-height: 1.25; text-shadow: var(--shadow); }
  .title { color: var(--text); font-size: calc(13px * var(--s)); font-weight: 600; }
  .sub { color: var(--sub); font-size: calc(11px * var(--s)); }
  .yaklasiyor .sub { color: var(--accent); font-weight: 600; }
  .moon { flex-shrink: 0; width: calc(16px * var(--s)); height: calc(16px * var(--s)); }
  .noicon .moon { display: none; }
  .noicon.pill { padding-left: calc(14px * var(--s)); }
  .hidden { display: none; }
  .pill { transition: background .3s, border-color .3s, opacity .18s; }
  .pill.fs { opacity: 0.12; }
  .pill.ghost { opacity: 0.18; }
  .pill.fs.ghost { opacity: 0.06; }
  .pill.active { opacity: 1; border-color: var(--accent); cursor: pointer; box-shadow: 0 0 0 2px var(--accent) inset; }
  .pill.moving { opacity: 1; border: 1px dashed var(--accent); cursor: move; }
  .close {
    display: none; margin-left: 2px; width: calc(26px * var(--s)); height: calc(26px * var(--s)); border: none; border-radius: 8px;
    background: var(--line); align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .girdi .close { display: flex; }
</style>
</head>
<body>
  <div class="pill" id="pill">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M74 -328Q74 -283 71.0 -235.5Q68 -188 62 -138Q57 -87 54.0 -52.5Q51 -18 51 0Q51 14 61.5 43.5Q72 73 93 118Q96 123 117.0 129.0Q138 135 169.0 140.5Q200 146 234.0 150.0Q268 154 297.5 156.5Q327 159 343 159L324 180Q296 211 275.5 238.5Q255 266 231 266Q208 266 186.0 249.0Q164 232 140 198L99 219Q128 293 168.5 338.0Q209 383 250 383Q274 383 296.0 365.0Q318 347 348 304Q380 257 408.5 224.5Q437 192 468 170L422 51Q381 51 334.5 48.0Q288 45 244.5 39.5Q201 34 167.0 27.5Q133 21 115 15Q121 -13 127.0 -41.0Q133 -69 139 -97Q148 -140 157.0 -184.0Q166 -228 175 -272Q149 -291 124.0 -305.0Q99 -319 74 -328Z" style="fill: var(--accent)" transform="translate(12,12) scale(0.02903,-0.02903) translate(-259.5,-27.5)"/></svg>
    <div class="texts">
      <span class="title" id="title">…</span>
      <span class="sub" id="sub"></span>
    </div>
    <button class="close" id="close" aria-label="Kapat">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="stroke: var(--text)" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>
<script src="widget.js"></script>
</body>
</html>
