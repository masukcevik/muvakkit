# macOS deneme paketi (Apple geliştirici hesabı olmadan, ad-hoc imzalı).
# Sonuç: Releases sayfasında "mac-deneme" adlı taslak; yalnızca depo sahibi görür.
name: macOS deneme

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mac-deneme.yml

concurrency:
  group: mac-deneme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # identity "-" = ad-hoc imza: sertifika gerektirmez, Apple Silicon'da "hasarlı" uyarısını önler
      - name: macOS paketi (ad-hoc imzalı)
        run: >-
          npx electron-builder --mac dmg --arm64 --x64 --publish never
          "-c.mac.identity=-" -c.mac.hardenedRuntime=false
          "-c.dmg.artifactName=NamazVakti-Mac-DENEME-\${version}-\${arch}.\${ext}"
      - name: Sürüm
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: mac-deneme-${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: macOS deneme ${{ steps.v.outputs.version }} (imzasız)
          body: Apple geliştirici hesabı olmadan derlenmiş deneme paketi. Yayınlamayın.
          files: dist/*.dmg
