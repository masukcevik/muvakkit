# macOS deneme paketleri (Apple geliştirici hesabı olmadan, ad-hoc imzalı) — Muvakkit
# Sonuç: Releases sayfasında "mac-deneme" adlı taslak; yalnızca depo sahibi görür.
#  - Yeni Mac'ler (macOS 12 ve üstü): arm64 + x64
#  - Eski Mac'ler (Intel, macOS 10.11+): Electron 22 ile x64
name: macOS deneme

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mac-deneme.yml

concurrency:
  group: mac-deneme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # identity "-" = ad-hoc imza: sertifika gerektirmez, Apple Silicon'da "hasarlı" uyarısını önler
      - name: Yeni Mac'ler için (macOS 12+)
        run: >-
          npx electron-builder --mac dmg --arm64 --x64 --publish never
          "-c.mac.identity=-" -c.mac.hardenedRuntime=false
          "-c.dmg.artifactName=Muvakkit-Mac-DENEME-\${version}-\${arch}.\${ext}"
      - name: Sürüm
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: mac-deneme-${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: macOS deneme ${{ steps.v.outputs.version }} (imzasız)
          body: |
            Apple geliştirici hesabı olmadan derlenmiş deneme paketleri. Yayınlamayın.
            - arm64: Apple çipli Mac'ler (M1–M4), macOS 12+
            - x64: Intel Mac'ler, macOS 12+
          
          files: dist/*.dmg

  # Eski Intel Mac'ler (2017 ve öncesi) — ayrı Intel sunucuda, ayrı taslakta
  macos-eski:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Eski Intel Mac'ler için (macOS 10.11+, Electron 22)
        run: |
          npm install --no-save electron@22.3.27
          npx electron-builder --mac dmg zip --x64 --publish never \
            -c.electronVersion=22.3.27 \
            -c.dmg.format=UDZO \
            "-c.mac.identity=-" -c.mac.hardenedRuntime=false \
            -c.mac.minimumSystemVersion=10.11 \
            -c.directories.output=dist-eski \
            "-c.mac.artifactName=Muvakkit-Mac-Eski-10.11-DENEME.\${ext}" "-c.dmg.artifactName=Muvakkit-Mac-Eski-10.11-DENEME.\${ext}"
      - name: Sürüm
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: mac-eski-deneme-${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Eski Mac deneme ${{ steps.v.outputs.version }} (imzasız)
          body: 2017 ve öncesi Intel Mac'ler için (macOS 10.11 El Capitan ve üstü). Deneme paketi, yayınlamayın.
          files: |
            dist-eski/*.dmg
            dist-eski/*.zip

  # Apple çipli (M1 vb.) Mac'ler, macOS 11 Big Sur için — Electron 37 (Big Sur'u destekleyen son sürüm)
  macos-bigsur:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: M1 + macOS 11 paketi (Electron 37)
        run: |
          npm install --no-save electron@37.10.3
          npx electron-builder --mac dmg zip --arm64 --publish never \
            -c.electronVersion=37.10.3 \
            "-c.mac.identity=-" -c.mac.hardenedRuntime=false \
            -c.mac.minimumSystemVersion=11.0 \
            -c.directories.output=dist-bigsur \
            "-c.mac.artifactName=Muvakkit-Mac-M1-BigSur-DENEME.\${ext}" "-c.dmg.artifactName=Muvakkit-Mac-M1-BigSur-DENEME.\${ext}"
      - name: Sürüm
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: mac-m1-bigsur-deneme-${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: M1 Mac (macOS 11) deneme ${{ steps.v.outputs.version }} (imzasız)
          body: Apple çipli Mac'ler, macOS 11 Big Sur ve üstü. Deneme paketi, yayınlamayın.
          files: |
            dist-bigsur/*.dmg
            dist-bigsur/*.zip
