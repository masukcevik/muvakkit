# Yeni sürüm: package.json'daki sürüm numarası değişip main dalına gönderilince
# (ya da Actions sekmesinden elle çalıştırılınca) Windows ve macOS paketlerini
# GitHub'ın kendi sunucularında derler, kaynağını doğrulanabilir şekilde işaretler ve
# Releases sayfasına yükler. Böylece indirilen her dosyanın bu depodaki koddan
# üretildiği herkes tarafından kontrol edilebilir.
name: Sürüm

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/surum.yml']
  workflow_dispatch:
    inputs:
      macos:
        description: 'macOS paketi de derlensin mi? (deneme aşamasında)'
        type: boolean
        default: false

permissions:
  contents: write       # Releases sayfasına dosya yüklemek için
  id-token: write       # kaynak doğrulama (attestation) için
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kurulum dosyası ve zip
        run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Microsoft Store paketi (Store bilgileri girildiyse)
        if: ${{ vars.STORE_IDENTITY_NAME != '' }}
        run: npx electron-builder --win appx --x64 --publish never
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.appx

  macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: macOS paketi (şimdilik imzasız)
        run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  yayinla:
    needs: [windows, macos]
    if: ${{ !failure() && !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm numarası
        id: surum
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: paketler
          merge-multiple: true
      - name: Kaynak doğrulaması
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'paketler/*'
      - name: Releases sayfasına yükle
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.surum.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Namaz Vakti ${{ steps.surum.outputs.version }}
          generate_release_notes: true
          files: |
            paketler/*.exe
            paketler/*.zip
            paketler/*.dmg
